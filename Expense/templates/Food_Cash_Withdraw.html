{% extends "base.html" %}
{% block title %}Food Cash Withdraw{% endblock %}
{% block mobile_title %}Food Cash Withdraw{% endblock %}

{% block content %}
  <div class="mb-8 rv">
    <a href="{% url 'ExpenseProfile' %}" class="inline-flex items-center gap-1.5 text-xs font-bold text-pallav-500 hover:text-pallav-700 transition mb-3">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Expense
    </a>
    <h1 class="font-display text-2xl sm:text-3xl font-bold text-pallav-900">Food Cash Withdraw</h1>
  </div>

  <div class="max-w-xl rounded-2xl bg-white ring-1 ring-pallav-100 shadow-sm p-6 sm:p-8 rv" x-data="{ withdrawer: '' }">
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label for="date" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Date</label>
          <input type="date" id="date" name="Food_withdrawal_date" readonly value="{{ current_date|date:'Y-m-d' }}"
            class="w-full rounded-xl border border-pallav-200 bg-pallav-50/50 px-4 py-3 text-sm font-semibold text-pallav-900 outline-none">
        </div>
        <div>
          <label for="time" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Time</label>
          <input type="text" id="time" name="Food_withdrawal_time" readonly
            class="w-full rounded-xl border border-pallav-200 bg-pallav-50/50 px-4 py-3 text-sm font-semibold text-pallav-900 outline-none">
        </div>
      </div>

      <div>
        <label for="username" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Username</label>
        <input type="text" id="username" name="Food_withdrawal_username" readonly value="{{ request.user.username }}"
          class="w-full rounded-xl border border-pallav-200 bg-pallav-50/50 px-4 py-3 text-sm font-semibold text-pallav-900 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-2">Who is making the withdrawal?</label>
        <div class="space-y-2">
          <label class="flex items-center gap-2.5 rounded-xl border border-pallav-200 px-4 py-2.5 text-sm font-semibold text-pallav-800 has-[:checked]:border-pallav-500 has-[:checked]:bg-pallav-50 transition cursor-pointer">
            <input type="radio" id="withdraw_kishore" name="Food_withdrawal_withdrawer" value="Mr.Jagdish Chaudhary" x-model="withdrawer" class="accent-pallav-600">
            Mr. Jagdish Chaudhary
          </label>
          <label class="flex items-center gap-2.5 rounded-xl border border-pallav-200 px-4 py-2.5 text-sm font-semibold text-pallav-800 has-[:checked]:border-pallav-500 has-[:checked]:bg-pallav-50 transition cursor-pointer">
            <input type="radio" id="withdraw_other" name="Food_withdrawal_withdrawer" value="Other" x-model="withdrawer" class="accent-pallav-600">
            Other
          </label>
        </div>
        <div x-show="withdrawer === 'Other'" x-cloak class="mt-3">
          <label for="other_person" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Other Person</label>
          <input type="text" id="other_person" name="Food_withdrawal_other_person"
            class="w-full rounded-xl border border-pallav-200 px-4 py-3 text-sm font-semibold text-pallav-900 focus:border-pallav-500 focus:ring-4 focus:ring-pallav-100 outline-none transition">
        </div>
      </div>

      <div>
        <label for="mobile_number" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Amount</label>
        <input type="text" id="mobile_number" name="Food_withdrawal_amount"
          class="w-full rounded-xl border border-pallav-200 px-4 py-3 text-sm font-semibold text-pallav-900 focus:border-pallav-500 focus:ring-4 focus:ring-pallav-100 outline-none transition">
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button type="submit" class="flex-1 rounded-xl bg-gradient-to-r from-gold-600 to-gold-800 hover:from-gold-700 hover:to-gold-900 text-white font-bold py-3 shadow-lg shadow-gold-900/20 transition hover:-translate-y-0.5 active:scale-[0.98]">
          Submit
        </button>
        <a href="{% url 'ExpenseProfile' %}" class="flex-1 text-center rounded-xl bg-pallav-50 hover:bg-pallav-100 text-pallav-700 font-bold py-3 transition">
          Cancel
        </a>
      </div>
    </form>
  </div>
{% endblock %}

{% block extra_js %}
<script>
    function formatTime(time) { return time < 10 ? '0' + time : time; }
    var now = new Date();
    var currentDate = now.getFullYear() + '-' + formatTime(now.getMonth() + 1) + '-' + formatTime(now.getDate());
    var currentTime = formatTime(now.getHours()) + ':' + formatTime(now.getMinutes());
    document.getElementById('date').value = currentDate;
    document.getElementById('time').value = currentTime;
</script>
{% endblock %}
