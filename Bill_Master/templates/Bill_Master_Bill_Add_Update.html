{% extends "base.html" %}
{% block title %}Bill Master — Update Bill{% endblock %}
{% block mobile_title %}Update Bill{% endblock %}

{% block content %}
  <div class="mb-8 rv">
    <a href="{% url 'BillMasterBillProfile' %}" class="inline-flex items-center gap-1.5 text-xs font-bold text-pallav-500 hover:text-pallav-700 transition mb-3">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Bills
    </a>
    <h1 class="font-display text-2xl sm:text-3xl font-bold text-pallav-900">Update Bill</h1>
  </div>

  <div class="max-w-4xl rounded-2xl bg-white ring-1 ring-pallav-100 shadow-sm p-6 sm:p-8 rv">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div>
        <label for="bill_Number" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Bill Number</label>
        <input type="text" id="bill_Number" name="bill_Number" readonly value="{{ bill_master_bill_update.Bill_Master_Bill_Number }}" class="w-full sm:w-64 rounded-xl border border-pallav-100 bg-pallav-50/60 text-pallav-500 px-4 py-2.5 text-sm">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-6">
        <div>
          <label for="bill_date" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Bill Date</label>
          <input type="date" id="bill_date" name="bill_date" value="{{ bill_master_bill_update.Bill_Master_Bill_Date|date:'Y-m-d' }}" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
        </div>
        <div>
          <label for="bill_master_Guest_Name" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Guest Name</label>
          <input type="text" id="bill_master_Guest_Name" name="bill_master_Guest_Name" value="{{ bill_master_bill_update.Bill_Master_Guest_Name }}" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
        </div>
        <div>
          <label for="bill_master_mobile_number" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Mobile Number</label>
          <input type="text" id="bill_master_mobile_number" name="bill_master_Mobile_Number" value="{{ bill_master_bill_update.Bill_Master_Mobile_Number }}" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
        </div>
        <div>
          <label for="select_company" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Select Company</label>
          <select id="select_company" name="select_company" required class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
            {% if bill_master_bill_update.Bill_Master_Bill_Company %}
              <option value="{{ bill_master_bill_update.Bill_Master_Bill_Company.id }}" selected>{{ bill_master_bill_update.Bill_Master_Bill_Company.Company_Name }}</option>
            {% else %}
              <option value="" disabled selected>Select Company</option>
            {% endif %}
            {% for company in companies %}
              <option value="{{ company.id }}">{{ company.Company_Name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="food_plan" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Plan</label>
          <select id="food_plan" name="Plan" required class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
            <option value="None" disabled>Select Plan</option>
            <option value="EP" {% if bill_master_bill_update.Bill_Master_Hotel_Plan == 'EP' %}selected{% endif %}>EP</option>
            <option value="CP" {% if bill_master_bill_update.Bill_Master_Hotel_Plan == 'CP' %}selected{% endif %}>CP</option>
            <option value="MAP" {% if bill_master_bill_update.Bill_Master_Hotel_Plan == 'MAP' %}selected{% endif %}>MAP</option>
            <option value="AP" {% if bill_master_bill_update.Bill_Master_Hotel_Plan == 'AP' %}selected{% endif %}>AP</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-6 pt-6 border-t border-pallav-100">
        <div class="rounded-xl bg-pallav-50/60 p-4">
          <p class="text-xs font-bold uppercase tracking-wide text-pallav-600 mb-3">Hotel Pallav</p>
          <div class="space-y-4">
            <div>
              <label for="bill_master_hotel_amount" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Hotel Amount</label>
              <input type="text" id="bill_master_hotel_amount" name="bill_master_hotel_amount" value="{{ bill_master_bill_update.Bill_Master_Hotel_Amount }}" class="w-full rounded-xl border border-pallav-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
            </div>
            <div>
              <label for="bill_master_plan_amount" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Plan Amount</label>
              <input type="text" id="bill_master_plan_amount" name="bill_master_plan_amount" class="w-full rounded-xl border border-pallav-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
            </div>
            <div>
              <label for="bill_master_laundry_amount" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Laundry Amount</label>
              <input type="text" id="bill_master_laundry_amount" name="bill_master_laundry_amount" class="w-full rounded-xl border border-pallav-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
            </div>
            <div>
              <label for="bill_master_hotel_gst" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Hotel GST</label>
              <input type="text" id="bill_master_hotel_gst" name="bill_master_hotel_gst" readonly value="{{ bill_master_bill_update.Bill_Master_Hotel_GST }}" class="w-full rounded-xl border border-pallav-200 bg-white text-pallav-600 px-4 py-2.5 text-sm">
            </div>
            <div>
              <label for="bill_master_hotel_mod" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Hotel Mode of Payment</label>
              <select id="bill_master_hotel_mod" name="bill_master_hotel_mod" required class="w-full rounded-xl border border-pallav-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
                <option value="None" disabled>Select Mode of Payment</option>
                <option value="Cash" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'Cash' %}selected{% endif %}>Cash</option>
                <option value="Card" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'Card' %}selected{% endif %}>Card</option>
                <option value="Complimentary" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'Complimentary' %}selected{% endif %}>Complimentary</option>
                <option value="Debit" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'Debit' %}selected{% endif %}>Debit</option>
                <option value="Bank Transfer" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
                <option value="Cheque" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'Cheque' %}selected{% endif %}>Cheque</option>
                <option value="UPI" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'UPI' %}selected{% endif %}>UPI</option>
                <option value="None" {% if bill_master_bill_update.Bill_Master_Hotel_Mode_Of_Payment == 'None' %}selected{% endif %}>None</option>
              </select>
            </div>
            <div>
              <label for="bill_master_hotel_total_amount" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Hotel Total Amount</label>
              <input type="text" id="bill_master_hotel_total_amount" name="bill_master_hotel_total_amount" readonly value="{{ bill_master_bill_update.Bill_Master_Balance_Hotel_Amount }}" class="w-full rounded-xl border border-pallav-200 bg-white text-pallav-800 font-mono font-bold px-4 py-2.5 text-sm">
            </div>
          </div>
        </div>
        <div class="rounded-xl bg-gold-50/60 p-4">
          <p class="text-xs font-bold uppercase tracking-wide text-gold-700 mb-3">Pallav Food</p>
          <div class="space-y-4">
            <div>
              <label for="bill_master_food_amount" class="block text-xs font-bold text-gold-700/80 uppercase tracking-wide mb-1.5">Food Amount</label>
              <input type="text" id="bill_master_food_amount" name="bill_master_food_amount" value="{{ bill_master_bill_update.Bill_Master_Food_Amount }}" class="w-full rounded-xl border border-gold-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gold-300 transition">
            </div>
            <div>
              <label for="bill_master_food_gst" class="block text-xs font-bold text-gold-700/80 uppercase tracking-wide mb-1.5">Food GST</label>
              <input type="text" id="bill_master_food_gst" name="bill_master_food_gst" value="{{ bill_master_bill_update.Bill_Master_Food_GST }}" class="w-full rounded-xl border border-gold-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gold-300 transition">
            </div>
            <div>
              <label for="bill_master_food_mod" class="block text-xs font-bold text-gold-700/80 uppercase tracking-wide mb-1.5">Food Mode of Payment</label>
              <select id="bill_master_food_mod" name="bill_master_food_mod" required class="w-full rounded-xl border border-gold-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gold-300 transition">
                <option value="None" disabled>Select Mode of Payment</option>
                <option value="Cash" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'Cash' %}selected{% endif %}>Cash</option>
                <option value="Card" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'Card' %}selected{% endif %}>Card</option>
                <option value="Complimentary" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'Complimentary' %}selected{% endif %}>Complimentary</option>
                <option value="Debit" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'Debit' %}selected{% endif %}>Debit</option>
                <option value="Bank Transfer" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
                <option value="Cheque" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'Cheque' %}selected{% endif %}>Cheque</option>
                <option value="UPI" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'UPI' %}selected{% endif %}>UPI</option>
                <option value="None" {% if bill_master_bill_update.Bill_Master_Food_Mode_Of_Payment == 'None' %}selected{% endif %}>None</option>
              </select>
            </div>
            <div>
              <label for="bill_master_food_total_amount" class="block text-xs font-bold text-gold-700/80 uppercase tracking-wide mb-1.5">Food Total Amount</label>
              <input type="text" id="bill_master_food_total_amount" name="bill_master_food_total_amount" readonly value="{{ bill_master_bill_update.Bill_Master_Balance_Food_Amount }}" class="w-full rounded-xl border border-gold-200 bg-white text-gold-800 font-mono font-bold px-4 py-2.5 text-sm">
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-6 pt-6 border-t border-pallav-100">
        <div>
          <label for="bill_master_name" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Reference Name</label>
          <input type="text" id="bill_master_name" name="bill_master_name" value="{{ bill_master_bill_update.Bill_Master_Reference_Name }}" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
        </div>
        <div>
          <label for="bill_master_number" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Reference Mobile Number</label>
          <input type="text" id="bill_master_number" name="bill_master_Number" value="{{ bill_master_bill_update.Bill_Master_Reference_Mobile_Number }}" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
        </div>
        <div class="sm:col-span-2">
          <label for="bill_master_instruction" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Instruction</label>
          <input type="text" id="bill_master_instruction" name="bill_master_instruction" value="{{ bill_master_bill_update.Bill_Master_Instruction }}" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
        </div>
      </div>

      <div class="mt-6 pt-6 border-t border-pallav-100">
        <h2 class="font-display text-lg font-bold text-pallav-900 mb-3">PDF Document</h2>
        <label for="upload_invoice_PDF" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Upload Invoice PDF</label>
        <input type="file" id="upload_invoice_PDF" name="upload_invoice_PDF" accept=".pdf" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pallav-50 file:text-pallav-700 file:font-bold file:px-3 file:py-1.5">
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-6 mt-6 border-t border-pallav-100">
        <button type="submit" class="flex-1 rounded-xl bg-gradient-to-r from-pallav-600 to-pallav-800 hover:from-pallav-700 hover:to-pallav-900 text-white font-bold py-3 shadow-lg shadow-pallav-900/20 transition hover:-translate-y-0.5 active:scale-[0.98]">
          Submit
        </button>
        <a href="{% url 'BillMasterAdvanceProfile' %}" class="flex-1 text-center rounded-xl bg-pallav-50 hover:bg-pallav-100 text-pallav-700 font-bold py-3 transition">
          Cancel
        </a>
      </div>
    </form>
  </div>
{% endblock %}

{% block extra_js %}
<script>
    function toggleDebitOption() {
        var debitOptionHotel = document.querySelector('#bill_master_hotel_mod option[value="Debit"]');
        var debitOptionFood = document.querySelector('#bill_master_food_mod option[value="Debit"]');
        var selectCompany = document.getElementById('select_company');

        if (selectCompany.value !== "") {
            debitOptionHotel.style.display = 'block';
            debitOptionFood.style.display = 'block';
        } else {
            debitOptionHotel.style.display = 'none';
            debitOptionFood.style.display = 'none';
        }
    }
    document.getElementById('select_company').addEventListener('change', toggleDebitOption);
    toggleDebitOption();
</script>

<script>
    var today = new Date();
    var dateString = today.getFullYear() + '-' + (today.getMonth() + 1).toString().padStart(2, '0') + '-' + today.getDate().toString().padStart(2, '0');
    document.getElementById('bill_date').value = dateString;

    var billNumberContext = "{{ bill_master_bill_update.Bill_Master_Bill_Number }}";
    if (billNumberContext) {
        document.getElementById('bill_Number').value = billNumberContext;
    } else {
        document.getElementById('bill_Number').value = today.getFullYear() + '/';
    }

    function calculateHotelTotalAmount() {
        var hotelAmount = parseFloat(document.getElementById('bill_master_hotel_amount').value) || 0;
        var hotelTaxRate = 0.12;
        var hotelTax = hotelAmount * hotelTaxRate;
        var hotelLaundryAmount = parseFloat(document.getElementById('bill_master_hotel_laundry_amount').value) || 0;
        var hotelPlanAmount = parseFloat(document.getElementById('bill_master_hotel_plan_amount').value) || 0;
        var totalHotelAmount = hotelAmount + hotelTax + hotelLaundryAmount - hotelPlanAmount;

        var hotelAdvanceAmount = parseFloat(document.getElementById('hotel_advance_amount').value) || 0;

        totalHotelAmount -= hotelAdvanceAmount;
        if (totalHotelAmount < 0) {
            totalHotelAmount = -Math.abs(totalHotelAmount);
        }

        document.getElementById('bill_master_hotel_total_amount').value = totalHotelAmount.toFixed(2);
        document.getElementById('bill_master_hotel_gst').value = hotelTax.toFixed(2);

        var foodPlanAmount = hotelPlanAmount;
        document.getElementById('bill_master_food_plan_amount').value = foodPlanAmount.toFixed(2);

        var foodAmount = parseFloat(document.getElementById('bill_master_food_amount').value) || 0;
        var foodGST = parseFloat(document.getElementById('bill_master_food_gst').value) || 0;
        var foodLaundryAmount = hotelLaundryAmount;
        var totalFoodAmount = foodAmount + foodGST + foodPlanAmount;

        totalFoodAmount -= hotelLaundryAmount;

        var foodAdvanceAmount = parseFloat(document.getElementById('food_advance_amount').value) || 0;

        totalFoodAmount -= foodAdvanceAmount;
        if (totalFoodAmount < 0) {
            totalFoodAmount = -Math.abs(totalFoodAmount);
        }

        document.getElementById('bill_master_food_total_amount').value = totalFoodAmount.toFixed(2);
        document.getElementById('bill_master_food_laundry_amount').value = hotelLaundryAmount.toFixed(2);
    }

    document.getElementById('bill_master_hotel_amount').addEventListener('input', calculateHotelTotalAmount);
    document.getElementById('bill_master_hotel_plan_amount').addEventListener('input', calculateHotelTotalAmount);
    document.getElementById('bill_master_hotel_laundry_amount').addEventListener('input', calculateHotelTotalAmount);
    document.getElementById('hotel_advance_amount').addEventListener('input', calculateHotelTotalAmount);
    document.getElementById('bill_master_food_amount').addEventListener('input', calculateHotelTotalAmount);
    document.getElementById('bill_master_food_gst').addEventListener('input', calculateHotelTotalAmount);
    calculateHotelTotalAmount();

    document.querySelectorAll('.select-advance').forEach(item => {
        item.addEventListener('click', event => {
            event.preventDefault();

            const receipt = item.getAttribute('data-receipt');
            const guest = item.getAttribute('data-guest');
            const hotelAmount = item.getAttribute('data-hotel-amount');
            const foodAmount = item.getAttribute('data-food-amount');

            document.getElementById('advance_receipt_number').value = receipt;
            document.getElementById('paid_by').value = guest;
            document.getElementById('hotel_advance_amount').value = hotelAmount;
            document.getElementById('food_advance_amount').value = foodAmount;

            $('#advanceModal').modal('hide');

            calculateHotelTotalAmount();
        });
    });
</script>
{% endblock %}
