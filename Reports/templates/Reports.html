{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block mobile_title %}Reports{% endblock %}

{% block content %}
  <div class="mb-8 rv">
    <h1 class="font-display text-2xl sm:text-3xl font-bold text-pallav-900">Reports</h1>
    <p class="text-sm text-pallav-500 mt-1">Generate daily reports for Hotel Pallav.</p>
  </div>

  <div class="rounded-2xl bg-white ring-1 ring-pallav-100 shadow-sm p-6 sm:p-8 rv max-w-xl">
    <button type="button" onclick="document.getElementById('hotelDailyReport').classList.remove('hidden')" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-pallav-600 to-pallav-800 hover:from-pallav-700 hover:to-pallav-900 text-white text-sm font-bold px-5 py-3 shadow-lg shadow-pallav-900/20 transition hover:-translate-y-0.5 active:scale-[0.98]">
      Hotel Daily Report
    </button>
  </div>

  <div id="hotelDailyReport" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-pallav-950/40 backdrop-blur-sm" onclick="document.getElementById('hotelDailyReport').classList.add('hidden')"></div>
    <div class="relative w-full max-w-md rounded-2xl bg-white shadow-2xl ring-1 ring-pallav-100">
      <div class="flex items-center justify-between px-6 py-4 border-b border-pallav-100">
        <h3 class="font-display text-lg font-bold text-pallav-900">Select Date Range From Date to To Date</h3>
        <button type="button" onclick="document.getElementById('hotelDailyReport').classList.add('hidden')" class="text-pallav-400 hover:text-pallav-700 transition text-xl leading-none">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <form>
          <div>
            <label for="fromDate" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">From Date:</label>
            <input type="date" id="fromDate" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
          </div>
          <div class="mt-4">
            <label for="toDate" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">To Date:</label>
            <input type="date" id="toDate" class="w-full rounded-xl border border-pallav-100 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pallav-300 transition">
          </div>
        </form>
      </div>
      <div class="flex justify-end gap-2 px-6 py-4 border-t border-pallav-100">
        <button type="button" onclick="document.getElementById('hotelDailyReport').classList.add('hidden')" class="rounded-lg bg-pallav-50 hover:bg-pallav-100 text-pallav-700 text-xs font-bold px-4 py-2 transition">Close</button>
        <button type="button" onclick="generateReport()" class="rounded-lg bg-pallav-600 hover:bg-pallav-700 text-white text-xs font-bold px-4 py-2 transition">Generate Report</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
<script>
    function generateReport() {
        var fromDate = document.getElementById("fromDate").value;
        var toDate = document.getElementById("toDate").value;
        alert("Generating report from " + fromDate + " to " + toDate);
    }

    var today = new Date().toISOString().split('T')[0];
    document.getElementById("fromDate").value = today;
    document.getElementById("toDate").value = today;
</script>
{% endblock %}
