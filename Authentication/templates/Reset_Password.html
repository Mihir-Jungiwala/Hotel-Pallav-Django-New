{% extends "guest_base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <h1 class="font-display text-2xl font-bold text-pallav-900 mb-1">Reset your password</h1>
  <p class="text-sm text-pallav-500 mb-6">Enter your username and we'll email you a reset link.</p>

  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="text" class="block text-xs font-bold text-pallav-500 uppercase tracking-wide mb-1.5">Username</label>
      <input type="text" id="text" name="username" required autofocus
        class="w-full rounded-xl border border-pallav-200 px-4 py-3 text-sm font-semibold text-pallav-900 focus:border-pallav-500 focus:ring-4 focus:ring-pallav-100 outline-none transition">
    </div>

    <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-pallav-600 to-pallav-800 hover:from-pallav-700 hover:to-pallav-900 text-white font-bold py-3 shadow-lg shadow-pallav-900/20 transition hover:-translate-y-0.5">
      Send Reset Email
    </button>
    <a href="{% url 'Login_In' %}" class="block text-center text-sm font-bold text-pallav-500 hover:text-pallav-700 transition pt-1">
      Cancel, back to sign in
    </a>
  </form>
{% endblock %}
