<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something went wrong — Hotel Pallav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Playfair Display', 'ui-serif', 'serif'], sans: ['Inter', 'ui-sans-serif', 'sans-serif'] },
      colors: { pallav: { 50:'#F7F4FF',100:'#EFE9FE',200:'#DFD3FD',300:'#C6B0FB',400:'#A886F7',500:'#8B5CF6',600:'#7C3AED',700:'#6D28D9',800:'#5B21B6',900:'#4A1A8F' },
                gold: { 400:'#F0C465',500:'#C9A227' } }
    } }
  }
</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-pallav-900 via-pallav-800 to-pallav-600 antialiased font-sans flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <div class="font-display font-extrabold text-white/90 leading-none mb-4" style="font-size:clamp(4rem,14vw,7rem)">Oops</div>
    <h1 class="font-display text-xl sm:text-2xl font-bold text-white mb-2">{{ error_message|default:"Something went wrong on our end." }}</h1>
    <p class="text-pallav-200 text-sm mb-8">We couldn't complete that request. Try again, or head back to the dashboard.</p>
    <a href="/Dashboard-Profile/" class="inline-flex items-center gap-2 rounded-xl bg-white text-pallav-800 font-bold px-6 py-3 shadow-lg hover:-translate-y-0.5 transition">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Dashboard
    </a>
  </div>
</body>
</html>
